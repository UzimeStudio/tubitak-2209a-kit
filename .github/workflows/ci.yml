name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: LibreOffice (PDF dönüşümü testi için)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Bağımlılıklar
        run: uv sync --group dev

      - name: Lint
        run: uv run --group dev ruff check .

      - name: Skill kopyası güncel mi
        run: uv run python tools/sync_skills.py --check

      - name: Testler
        run: uv run --group dev pytest -q
