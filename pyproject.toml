[project]
name = "tubitak-2209a-kit"
version = "0.1.0"
description = "TÜBİTAK 2209-A başvurusu ve sonuç raporu için Claude Code / Codex çalışma kiti"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdf>=4.3",
    "pypdfium2>=4.30",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
line-length = 110
target-version = "py311"
